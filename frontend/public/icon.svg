<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="100%" stop-color="#4d8a72"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="100%" stop-color="#e8b84a"/>
    </linearGradient>
  </defs>

  <!-- Clean white bg -->
  <rect width="512" height="512" rx="512" fill="white"/>

  <!-- Geometric S shape: overlapping circles and arcs -->
  <!-- Top circle -->
  <circle cx="220" cy="200" r="65" fill="url(#g1)" opacity="0.12"/>
  <circle cx="220" cy="200" r="45" fill="url(#g1)" opacity="0.2"/>
  <circle cx="220" cy="200" r="28" fill="url(#g1)" opacity="0.35"/>

  <!-- Bottom circle -->
  <circle cx="292" cy="312" r="65" fill="url(#g2)" opacity="0.12"/>
  <circle cx="292" cy="312" r="45" fill="url(#g2)" opacity="0.2"/>
  <circle cx="292" cy="312" r="28" fill="url(#g2)" opacity="0.35"/>

  <!-- Connecting S curve -->
  <path d="M220 145 C220 145 195 175 195 200 C195 230 220 245 240 256 C260 267 285 280 285 310 C285 335 275 350 260 360"
        fill="none" stroke="url(#g1)" stroke-width="16" stroke-linecap="round"/>
  
  <path d="M235 150 C235 150 215 175 215 200 C215 228 238 242 256 256 C274 270 295 285 295 310 C295 330 285 345 270 355"
        fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

  <!-- Gold accent dots -->
  <circle cx="220" cy="200" r="6" fill="url(#g2)"/>
  <circle cx="292" cy="312" r="6" fill="url(#g1)"/>

  <!-- Brand text -->
  <text x="256" y="440" text-anchor="middle" fill="#0a0e1a" font-size="38" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="4">SOLIQ</text>
  <text x="256" y="470" text-anchor="middle" fill="#8896a8" font-size="22" font-weight="500" font-family="system-ui, sans-serif" letter-spacing="6">PAY</text>
</svg>
