<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="512" fill="url(#bg)"/>

  <!-- Exaggerated Minimalism: bold S -->
  <text x="256" y="320" text-anchor="middle" fill="url(#gold)" font-size="320" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="-8">S</text>

  <!-- Subtle underline accent -->
  <rect x="140" y="360" width="232" height="4" rx="2" fill="url(#gold)" opacity="0.4"/>
</svg>
