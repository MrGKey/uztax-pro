<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="40%" stop-color="#fbe8b8"/>
      <stop offset="100%" stop-color="#d4a843"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="512" fill="url(#bg)"/>

  <!-- Subtle ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.06"/>

  <!-- Giant S filling the circle -->
  <text x="256" y="350" text-anchor="middle" fill="url(#gold)" font-size="380" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="-10" filter="url(#glow)">S</text>
  <text x="256" y="350" text-anchor="middle" fill="url(#gold)" font-size="380" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="-10">S</text>

  <!-- Gold accent line at bottom -->
  <rect x="160" y="390" width="192" height="3" rx="1.5" fill="url(#gold)" opacity="0.3"/>
</svg>
