<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="100%" stop-color="#5a9a82"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="100%" stop-color="#e8b84a"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="100%" stop-color="#a8d5c3"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="100%" stop-color="#fbe8b8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f9d898" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="sparkGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Glow effect behind chart -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>

  <!-- Subtle geometric grid -->
  <g opacity="0.04" stroke="#f9d898" stroke-width="0.5">
    <line x1="0" y1="80" x2="512" y2="80"/>
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="240" x2="512" y2="240"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="400" x2="512" y2="400"/>
  </g>

  <!-- Bar chart - 8 bars growing from bottom -->
  <g transform="translate(72, 340)">
    <!-- Baseline -->
    <line x1="0" y1="0" x2="368" y2="0" stroke="#77b39b" stroke-width="1.5" opacity="0.15"/>

    <!-- Bars with gradient -->
    <rect x="8" y="-100" width="32" height="100" rx="6" fill="url(#teal)" opacity="0.5"/>
    <rect x="8" y="-100" width="32" height="100" rx="6" fill="url(#bar1)" opacity="0.3"/>

    <rect x="52" y="-140" width="32" height="140" rx="6" fill="url(#teal)" opacity="0.6"/>
    <rect x="52" y="-140" width="32" height="140" rx="6" fill="url(#bar1)" opacity="0.35"/>

    <rect x="96" y="-120" width="32" height="120" rx="6" fill="url(#teal)" opacity="0.55"/>
    <rect x="96" y="-120" width="32" height="120" rx="6" fill="url(#bar1)" opacity="0.3"/>

    <rect x="140" y="-180" width="32" height="180" rx="6" fill="url(#gold)" opacity="0.85"/>
    <rect x="140" y="-180" width="32" height="180" rx="6" fill="url(#bar2)" opacity="0.5"/>

    <rect x="184" y="-160" width="32" height="160" rx="6" fill="url(#teal)" opacity="0.65"/>
    <rect x="184" y="-160" width="32" height="160" rx="6" fill="url(#bar1)" opacity="0.35"/>

    <rect x="228" y="-200" width="32" height="200" rx="6" fill="url(#gold)" opacity="0.9"/>
    <rect x="228" y="-200" width="32" height="200" rx="6" fill="url(#bar2)" opacity="0.55"/>
    <rect x="228" y="-200" width="32" height="200" rx="6" fill="white" opacity="0.05"/>

    <rect x="272" y="-130" width="32" height="130" rx="6" fill="url(#teal)" opacity="0.6"/>
    <rect x="272" y="-130" width="32" height="130" rx="6" fill="url(#bar1)" opacity="0.3"/>

    <rect x="316" y="-110" width="32" height="110" rx="6" fill="url(#teal)" opacity="0.5"/>
    <rect x="316" y="-110" width="32" height="110" rx="6" fill="url(#bar1)" opacity="0.25"/>
  </g>

  <!-- Sparkline overlay -->
  <path d="M88 270 L112 240 L136 255 L160 210 L184 230 L208 190 L232 210 L256 175 L280 195 L304 220 L328 205 L352 225" 
        stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8" filter="url(#sparkGlow)"/>

  <!-- Dot at peak -->
  <circle cx="256" cy="175" r="6" fill="url(#gold)"/>
  <circle cx="256" cy="175" r="12" fill="url(#gold)" opacity="0.15"/>

  <!-- Small decorative dots -->
  <circle cx="100" cy="120" r="3" fill="#77b39b" opacity="0.15"/>
  <circle cx="400" cy="180" r="4" fill="#f9d898" opacity="0.12"/>
  <circle cx="420" cy="380" r="3" fill="#77b39b" opacity="0.1"/>
  <circle cx="80" cy="380" r="2" fill="#f9d898" opacity="0.1"/>
  <circle cx="340" cy="100" r="2.5" fill="#77b39b" opacity="0.12"/>

  <!-- Sum symbol at bottom right -->
  <text x="420" y="460" text-anchor="middle" fill="#77b39b" font-size="40" font-weight="200" font-family="system-ui, sans-serif" opacity="0.15">so'm</text>
</svg>
