<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="50%" stop-color="#6aaa90"/>
      <stop offset="100%" stop-color="#4d8a72"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="100%" stop-color="#f0c470"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f9d898" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f9d898" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle glow -->
  <circle cx="256" cy="256" r="180" fill="#77b39b" opacity="0.08"/>

  <!-- Card outline -->
  <rect x="120" y="130" width="272" height="180" rx="24" fill="#0a0e1a" opacity="0.15"/>
  <rect x="116" y="126" width="272" height="180" rx="24" fill="#131d33" opacity="0.3"/>
  <rect x="112" y="122" width="272" height="180" rx="24" fill="none" stroke="#f9d898" stroke-width="1.5" opacity="0.4"/>

  <!-- Card lines -->
  <rect x="136" y="148" width="100" height="8" rx="4" fill="#77b39b" opacity="0.5"/>
  <rect x="136" y="164" width="140" height="6" rx="3" fill="#77b39b" opacity="0.3"/>
  <rect x="136" y="178" width="80" height="6" rx="3" fill="#77b39b" opacity="0.3"/>

  <!-- Chart line -->
  <path d="M136 220 L180 200 L220 215 L260 185 L300 205 L340 190" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M136 220 L180 200 L220 215 L260 185 L300 205 L340 190 L340 260 L136 260 Z" fill="url(#chart)"/>

  <!-- Gold accent dot -->
  <circle cx="340" cy="190" r="5" fill="url(#gold)"/>
  <circle cx="340" cy="190" r="9" fill="url(#gold)" opacity="0.2"/>

  <!-- Letter U -->
  <text x="256" y="370" text-anchor="middle" fill="white" font-size="140" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="-2">U</text>

  <!-- Text below -->
  <text x="256" y="400" text-anchor="middle" fill="white" font-size="22" font-weight="500" font-family="system-ui, sans-serif" opacity="0.6" letter-spacing="4">ТАХ</text>

  <!-- Decorative dots -->
  <circle cx="116" cy="116" r="4" fill="#f9d898" opacity="0.2"/>
  <circle cx="400" cy="140" r="3" fill="#f9d898" opacity="0.15"/>
  <circle cx="360" cy="400" r="5" fill="#f9d898" opacity="0.1"/>
  <circle cx="130" cy="380" r="3" fill="#f9d898" opacity="0.12"/>
  <circle cx="380" cy="100" r="2" fill="#77b39b" opacity="0.15"/>
</svg>
