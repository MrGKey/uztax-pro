<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="100%" stop-color="#e8b84a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="100%" stop-color="#4d8a72"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="512" fill="url(#bg)"/>

  <!-- Letter S - main brand mark -->
  <text x="256" y="310" text-anchor="middle" fill="url(#gold)" font-size="280" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="-5" filter="url(#glow)">S</text>
  <text x="256" y="310" text-anchor="middle" fill="white" font-size="280" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="-5">S</text>

  <!-- Teal accent arc -->
  <path d="M170 340 Q256 400 342 340" fill="none" stroke="url(#teal)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Gold dot at arc end -->
  <circle cx="342" cy="340" r="5" fill="url(#gold)"/>
</svg>
