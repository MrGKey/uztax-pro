<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="50%" stop-color="#6aaa90"/>
      <stop offset="100%" stop-color="#4d8a72"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="512" fill="white"/>

  <!-- Minimalist abstract S curve -->
  <g transform="translate(256, 260)">
    <!-- Three horizontal bars forming an abstract S -->
    <rect x="-90" y="-65" width="180" height="30" rx="15" fill="url(#g)" opacity="0.9"/>
    <rect x="-110" y="-15" width="140" height="30" rx="15" fill="url(#g)" opacity="0.55"/>
    <rect x="-90" y="35" width="180" height="30" rx="15" fill="url(#g)" opacity="0.9"/>
  </g>
</svg>
