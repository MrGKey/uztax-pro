<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="40%" stop-color="#fbe8b8"/>
      <stop offset="100%" stop-color="#d4a843"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="100%" stop-color="#4d8a72"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="50%" stop-color="#f9d898"/>
      <stop offset="100%" stop-color="#77b39b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="512" fill="url(#bg)"/>

  <!-- Double ring - Telegram Premium style -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.15"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.08"/>

  <!-- Broadcast waves (Telegram style) -->
  <g stroke="url(#teal)" fill="none" stroke-linecap="round">
    <path d="M370 200 Q395 256 370 312" stroke-width="3" opacity="0.6"/>
    <path d="M390 170 Q425 256 390 342" stroke-width="2.5" opacity="0.35"/>
    <path d="M410 140 Q455 256 410 372" stroke-width="2" opacity="0.15"/>
  </g>

  <!-- S letter inside circle -->
  <circle cx="256" cy="256" r="95" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.3"/>
  <text x="256" y="298" text-anchor="middle" fill="url(#gold)" font-size="120" font-weight="900" font-family="system-ui, sans-serif">S</text>

  <!-- Gold dot accent -->
  <circle cx="380" cy="190" r="4" fill="url(#gold)" opacity="0.5"/>
</svg>
