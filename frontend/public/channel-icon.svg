<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="100%" stop-color="#e8b84a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="100%" stop-color="#4d8a72"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f9d898" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#77b39b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark fintech bg -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Decorative ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ring)" stroke-width="1"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ring)" stroke-width="0.5"/>

  <!-- Glow behind icon -->
  <circle cx="256" cy="230" r="120" fill="url(#ring)"/>

  <!-- Notification bell icon -->
  <g transform="translate(256, 215)" filter="url(#glow)">
    <!-- Bell body -->
    <path d="M-30 -15 Q-30 -50 0 -55 Q30 -50 30 -15 L35 10 Q38 20 30 25 L-30 25 Q-38 20 -35 10 Z" 
          fill="none" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Bell top -->
    <circle cx="0" cy="-55" r="6" fill="url(#gold)"/>
    
    <!-- Bell bottom line -->
    <line x1="-18" y1="35" x2="18" y2="35" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>

    <!-- Notification dot -->
    <circle cx="22" cy="-48" r="8" fill="#f87171"/>
    <circle cx="22" cy="-48" r="4" fill="white" opacity="0.6"/>
  </g>

  <!-- Sound waves -->
  <g transform="translate(256, 215)" stroke="url(#teal)" fill="none" stroke-linecap="round">
    <path d="M45 -30 Q60 -20 45 0" stroke-width="2.5" opacity="0.6"/>
    <path d="M55 -40 Q75 -20 55 10" stroke-width="2" opacity="0.4"/>
    <path d="M65 -50 Q90 -20 65 20" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- Brand name -->
  <text x="256" y="365" text-anchor="middle" fill="white" font-size="32" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="6">SOLIQPAY</text>

  <!-- Gold accent line -->
  <rect x="170" y="380" width="172" height="2" rx="1" fill="url(#gold)" opacity="0.5"/>

  <!-- Small decorative dots -->
  <circle cx="100" cy="120" r="3" fill="#f9d898" opacity="0.1"/>
  <circle cx="420" cy="140" r="2.5" fill="#77b39b" opacity="0.08"/>
  <circle cx="400" cy="420" r="4" fill="#f9d898" opacity="0.06"/>
  <circle cx="110" cy="400" r="2" fill="#77b39b" opacity="0.06"/>
</svg>
