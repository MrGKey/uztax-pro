<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="100%" stop-color="#e8b84a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="100%" stop-color="#4d8a72"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="512" fill="url(#bg)"/>

  <!-- Megaphone / Bullhorn - centered large -->
  <g transform="translate(256, 240)" filter="url(#glow)">
    <!-- Horn body -->
    <path d="M-55 -50 L110 -70 L125 -10 L125 10 L110 70 L-55 50 Z" 
          fill="url(#teal)" opacity="0.2" stroke="url(#gold)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M-55 -50 L110 -70 L125 -10 L125 10 L110 70 L-55 50 Z" 
          stroke="white" stroke-width="1.5" stroke-linejoin="round" opacity="0.3"/>

    <!-- Speaker lines (3 large horizontal lines) -->
    <line x1="-25" y1="-30" x2="75" y2="-48" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-25" y1="-5" x2="75" y2="-23" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-25" y1="20" x2="75" y2="2" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

    <!-- Handle -->
    <path d="M-55 -50 Q-85 -30 -80 5 Q-85 30 -60 50" 
          fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

    <!-- Red notification dot -->
    <circle cx="110" cy="-65" r="14" fill="#f87171"/>
    <circle cx="110" cy="-65" r="6" fill="white" opacity="0.5"/>
  </g>

  <!-- Sound waves -->
  <g stroke="url(#teal)" fill="none" stroke-linecap="round">
    <path d="M140 -25 Q158 -5 140 20" stroke-width="3" opacity="0.7"/>
    <path d="M155 -38 Q175 -5 155 32" stroke-width="2.5" opacity="0.4"/>
  </g>
</svg>
