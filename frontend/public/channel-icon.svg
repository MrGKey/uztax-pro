<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="100%" stop-color="#e8b84a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Broadcast icon -->
  <g transform="translate(256, 220)" stroke="url(#gold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Megaphone body -->
    <path d="M-30 -40 L120 -60 L120 40 L-30 20 Z" stroke-width="6" fill="url(#gold)" opacity="0.15"/>
    <path d="M-30 -40 L120 -60 L120 40 L-30 20 Z" stroke-width="3"/>
    
    <!-- Speaker grill -->
    <line x1="-10" y1="-25" x2="80" y2="-38" stroke-width="2.5"/>
    <line x1="-10" y1="-10" x2="80" y2="-23" stroke-width="2.5"/>
    <line x1="-10" y1="5" x2="80" y2="-8" stroke-width="2.5"/>
    
    <!-- Handle -->
    <path d="M-30 -40 Q-60 -30 -50 0 Q-55 5 -50 10 L-30 20" stroke-width="4"/>
    
    <!-- Sound waves -->
    <path d="M130 -35 Q145 -20 130 0" stroke-width="2" opacity="0.6"/>
    <path d="M140 -45 Q160 -20 140 10" stroke-width="2" opacity="0.4"/>
    <path d="M150 -55 Q175 -20 150 20" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- Text -->
  <text x="256" y="340" text-anchor="middle" fill="white" font-size="36" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="6">SOLIQPAY</text>
  <text x="256" y="370" text-anchor="middle" fill="#8896a8" font-size="22" font-weight="500" font-family="system-ui, sans-serif" letter-spacing="4">НОВОСТИ</text>

  <!-- Decorative dots -->
  <circle cx="120" cy="120" r="3" fill="#f9d898" opacity="0.1"/>
  <circle cx="400" cy="140" r="4" fill="#77b39b" opacity="0.08"/>
  <circle cx="380" cy="400" r="2.5" fill="#f9d898" opacity="0.08"/>
  <circle cx="100" cy="380" r="2" fill="#77b39b" opacity="0.06"/>
</svg>
