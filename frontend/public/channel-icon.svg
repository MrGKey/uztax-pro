<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="512" fill="url(#bg)"/>

  <!-- Broadcast ring - outer -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.15"/>

  <!-- Abstract broadcast symbol - three arcs -->
  <g transform="translate(256, 246)" fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M-30 -40 L110 -55 L120 -10 L120 10 L110 55 L-30 40" stroke-width="4.5" stroke-linejoin="round" opacity="0.9"/>
    <line x1="-10" y1="-28" x2="75" y2="-42" stroke-width="5"/>
    <line x1="-10" y1="-3" x2="75" y2="-17" stroke-width="5"/>
    <line x1="-10" y1="22" x2="75" y2="8" stroke-width="5"/>
    <path d="M-30 -40 Q-55 -20 -55 8 Q-55 30 -35 40" stroke-width="4.5"/>
  </g>

  <!-- Radiating waves -->
  <g stroke="url(#gold)" fill="none" stroke-linecap="round" opacity="0.25">
    <path d="M140 -50 Q165 0 140 50" stroke-width="2.5"/>
    <path d="M160 -70 Q190 0 160 70" stroke-width="1.5"/>
  </g>
</svg>
