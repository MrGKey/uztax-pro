<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="100%" stop-color="#4d8a72"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="100%" stop-color="#e8b84a"/>
    </linearGradient>
  </defs>

  <!-- Clean white bg -->
  <rect width="512" height="512" rx="512" fill="white"/>

  <!-- Three announcement circles radiating -->
  <g opacity="0.08">
    <circle cx="256" cy="256" r="190" fill="url(#g1)"/>
    <circle cx="256" cy="256" r="150" fill="url(#g2)"/>
    <circle cx="256" cy="256" r="110" fill="url(#g1)"/>
  </g>

  <!-- Central broadcast icon -->
  <g transform="translate(256, 240)">
    <!-- Circle emblem -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#g1)" stroke-width="3" opacity="0.3"/>
    
    <!-- Abstract megaphone / signal -->
    <path d="M-30 -35 Q-45 -60 -20 -70 L55 -50 L65 -20 L65 20 L55 50 L-20 70 Q-45 60 -30 35"
          fill="none" stroke="url(#g1)" stroke-width="4" stroke-linejoin="round" opacity="0.7"/>
    
    <!-- Signal bars inside -->
    <rect x="-8" y="-30" width="6" height="30" rx="2" fill="url(#g1)" opacity="0.5"/>
    <rect x="4" y="-40" width="6" height="40" rx="2" fill="url(#g2)" opacity="0.7"/>
    <rect x="16" y="-25" width="6" height="25" rx="2" fill="url(#g1)" opacity="0.4"/>
    <rect x="28" y="-45" width="6" height="45" rx="2" fill="url(#g2)" opacity="0.8"/>

    <!-- Gold dot on top -->
    <circle cx="0" cy="-70" r="6" fill="url(#g2)"/>
    <circle cx="0" cy="-70" r="12" fill="url(#g2)" opacity="0.12"/>
  </g>

  <!-- Radiating arcs -->
  <g stroke="url(#g2)" fill="none" stroke-linecap="round" opacity="0.15">
    <path d="M350 190 Q370 240 350 290" stroke-width="2"/>
    <path d="M370 170 Q395 240 370 310" stroke-width="1.5"/>
  </g>

  <!-- Brand -->
  <text x="256" y="440" text-anchor="middle" fill="#0a0e1a" font-size="34" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="4">SOLIQPAY</text>
  <text x="256" y="465" text-anchor="middle" fill="#8896a8" font-size="18" font-weight="500" font-family="system-ui, sans-serif" letter-spacing="4">KANAL</text>
</svg>
