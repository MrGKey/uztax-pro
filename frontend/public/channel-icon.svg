<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="50%" stop-color="#6aaa90"/>
      <stop offset="100%" stop-color="#4d8a72"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="512" fill="white"/>

  <!-- Bullhorn / megaphone minimal -->
  <g transform="translate(256, 252)">
    <!-- Horn body -->
    <path d="M-50 -40 L80 -60 L95 -15 L95 15 L80 60 L-50 40 Z" 
          fill="url(#g)" opacity="0.15" stroke="url(#g)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Three announcement lines -->
    <line x1="-20" y1="-25" x2="55" y2="-40" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-20" y1="0" x2="55" y2="-15" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-20" y1="25" x2="55" y2="10" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>

    <!-- Handle -->
    <path d="M-50 -40 Q-70 -20 -70 5 Q-70 25 -55 40" 
          fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
