<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="40%" stop-color="#fbe8b8"/>
      <stop offset="100%" stop-color="#d4a843"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="100%" stop-color="#3d7a62"/>
    </linearGradient>
    <filter id="depth">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f9d898" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="512" fill="url(#bg)"/>

  <!-- Outer rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.05"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#teal)" stroke-width="0.5" opacity="0.04"/>

  <!-- Radiating signal rings (broadcast metaphor) -->
  <g stroke="url(#teal)" fill="none" stroke-linecap="round" opacity="0.12">
    <circle cx="256" cy="246" r="140" stroke-width="1.5"/>
    <circle cx="256" cy="246" r="110" stroke-width="2"/>
    <circle cx="256" cy="246" r="80" stroke-width="2.5"/>
  </g>

  <!-- Central broadcast icon -->
  <g transform="translate(256, 246)" filter="url(#depth)">
    <!-- Outer shield/circle -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="url(#gold)" stroke-width="3.5" opacity="0.9"/>
    <circle cx="0" cy="0" r="48" fill="url(#gold)" opacity="0.06"/>

    <!-- Play/Signal triangle -->
    <polygon points="-16,-28 20,0 -16,28" fill="url(#gold)" opacity="0.9"/>
    <polygon points="-12,-22 16,0 -12,22" fill="url(#bg)"/>
    
    <!-- Right side bars (signal strength) -->
    <rect x="28" y="-24" width="5" height="20" rx="2.5" fill="url(#teal)" opacity="0.5"/>
    <rect x="36" y="-16" width="5" height="12" rx="2.5" fill="url(#teal)" opacity="0.35"/>
    <rect x="44" y="-8" width="5" height="4" rx="2.5" fill="url(#teal)" opacity="0.2"/>

    <!-- Small gold accent dot -->
    <circle cx="0" cy="-58" r="3" fill="url(#gold)" opacity="0.5"/>
  </g>

  <!-- Sound waves right side -->
  <g stroke="url(#gold)" fill="none" stroke-linecap="round" opacity="0.15">
    <path d="M320 210 Q340 246 320 282" stroke-width="2.5"/>
    <path d="M340 190 Q365 246 340 302" stroke-width="2"/>
    <path d="M360 170 Q390 246 360 322" stroke-width="1.5"/>
  </g>

  <!-- Brand text at bottom -->
  <text x="256" y="430" text-anchor="middle" fill="white" font-size="13" font-weight="600" font-family="system-ui, sans-serif" letter-spacing="4" opacity="0.3">SOLIQPAY</text>
</svg>
