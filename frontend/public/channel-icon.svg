<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b39b"/>
      <stop offset="100%" stop-color="#4d8a72"/>
    </linearGradient>
    <linearGradient id="coinInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d898"/>
      <stop offset="100%" stop-color="#e8b84a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f9d898" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Main shape: Megaphone / Broadcast -->
  <g transform="translate(256, 230)" filter="url(#shadow)">
    <!-- Megaphone body -->
    <path d="M-35 -35 L100 -55 L110 -15 L110 15 L100 55 L-35 35 Z" fill="#1a2a4a" stroke="url(#coin)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-35 -35 L100 -55 L110 -15 L110 15 L100 55 L-35 35 Z" fill="url(#coin)" opacity="0.15"/>

    <!-- Speaker lines -->
    <line x1="-15" y1="-20" x2="65" y2="-32" stroke="url(#coin)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="-5" x2="65" y2="-17" stroke="url(#coin)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="10" x2="65" y2="-2" stroke="url(#coin)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="25" x2="65" y2="13" stroke="url(#coin)" stroke-width="3" stroke-linecap="round"/>

    <!-- Handle -->
    <path d="M-35 -35 Q-60 -20 -55 5 Q-60 25 -40 35" fill="none" stroke="url(#coinInner)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Notification dot -->
    <circle cx="95" cy="-50" r="12" fill="#f87171"/>
    <circle cx="95" cy="-50" r="5" fill="white" opacity="0.5"/>

    <!-- Sound waves -->
    <path d="M115 -20 Q130 -5 115 15" stroke="url(#coinInner)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M128 -30 Q145 -5 128 25" stroke="url(#coinInner)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Brand -->
  <text x="256" y="380" text-anchor="middle" fill="white" font-size="32" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="6">SOLIQPAY</text>
  <rect x="180" y="395" width="152" height="2" rx="1" fill="url(#coin)" opacity="0.4"/>
  <text x="256" y="415" text-anchor="middle" fill="#8896a8" font-size="18" font-weight="500" font-family="system-ui, sans-serif" letter-spacing="4">KANAL</text>
</svg>
